<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .pub { fill:#e8f5e9; stroke:#2e7d32; stroke-width:2; }
    .sub { fill:#e3f2fd; stroke:#1565c0; stroke-width:2; }
    .core { fill:#fff3e0; stroke:#c77a3a; stroke-width:2; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .small { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.8; fill:none; marker-end:url(#ar5); }
  </style>

  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold">Pub/Sub: Fire-and-Forget Messaging</text>

  <rect x="40" y="60" width="140" height="45" rx="6" class="pub"/>
  <text x="110" y="87" class="lbl">Publisher</text>

  <rect x="300" y="130" width="180" height="60" rx="10" class="core"/>
  <text x="390" y="155" class="lbl">Redis Server</text>
  <text x="390" y="173" class="small">channel: "news"</text>

  <path d="M180,90 L300,150" class="w"/>
  <text x="240" y="105" class="small">PUBLISH news "hi"</text>

  <rect x="580" y="60"  width="140" height="45" rx="6" class="sub"/><text x="650" y="87" class="lbl">Subscriber A</text>
  <rect x="580" y="130" width="140" height="45" rx="6" class="sub"/><text x="650" y="157" class="lbl">Subscriber B</text>
  <rect x="580" y="200" width="140" height="45" rx="6" class="sub"/><text x="650" y="227" class="lbl">Subscriber C</text>

  <path d="M480,150 L580,82" class="w"/>
  <path d="M480,155 L580,152" class="w"/>
  <path d="M480,165 L580,220" class="w"/>
  <text x="530" y="60" class="small">SUBSCRIBE news</text>

  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Messages are NOT persisted — a subscriber that isn't connected when PUBLISH happens misses the message.
  </text>
  <text x="380" y="290" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    PSUBSCRIBE supports glob patterns (e.g. "news.*"). For durable/replayable messaging, use Streams instead.
  </text>
</svg>
