<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="380" fill="#ffffff"/>
  <style>
    .cmd { fill:#eef4ff; stroke:#3a6bc7; stroke-width:1.5; }
    .rtt { fill:#ffebee; stroke:#c62828; stroke-width:1.3; }
    .lbl { font-size:12px; fill:#111; text-anchor:middle; }
    .hdr { font-size:15px; fill:#111; text-anchor:middle; font-weight:bold; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
  </style>

  <text x="410" y="22" text-anchor="middle" font-size="16" font-weight="bold">Round-Trips: Naive vs Pipelined vs Transaction</text>

  <!-- Naive -->
  <g transform="translate(20,50)">
    <text x="120" y="0" class="hdr">Naive (1 RTT per command)</text>
    <rect x="0" y="20" width="70" height="30" class="cmd"/><text x="35" y="40" class="lbl">SET a</text>
    <rect x="0" y="60" width="70" height="20" class="rtt"/><text x="35" y="74" class="lbl" font-size="9">wait RTT</text>
    <rect x="0" y="90" width="70" height="30" class="cmd"/><text x="35" y="110" class="lbl">SET b</text>
    <rect x="0" y="130" width="70" height="20" class="rtt"/><text x="35" y="144" class="lbl" font-size="9">wait RTT</text>
    <rect x="0" y="160" width="70" height="30" class="cmd"/><text x="35" y="180" class="lbl">SET c</text>
    <rect x="0" y="200" width="70" height="20" class="rtt"/><text x="35" y="214" class="lbl" font-size="9">wait RTT</text>
    <text x="120" y="250" class="sub">3 commands = 3 network round-trips</text>
  </g>

  <!-- Pipelined -->
  <g transform="translate(300,50)">
    <text x="120" y="0" class="hdr">Pipelined (batched)</text>
    <rect x="0" y="20" width="70" height="30" class="cmd"/><text x="35" y="40" class="lbl">SET a</text>
    <rect x="80" y="20" width="70" height="30" class="cmd"/><text x="115" y="40" class="lbl">SET b</text>
    <rect x="160" y="20" width="70" height="30" class="cmd"/><text x="195" y="40" class="lbl">SET c</text>
    <text x="115" y="65" class="sub">sent together, no waiting between</text>
    <rect x="0" y="85" width="230" height="20" class="rtt"/><text x="115" y="99" class="lbl" font-size="9">single wait for all replies</text>
    <text x="120" y="130" class="sub">3 commands = 1 network round-trip</text>
    <text x="120" y="150" class="sub" font-style="italic">(not atomic — other clients' commands</text>
    <text x="120" y="165" class="sub" font-style="italic">may interleave between them)</text>
  </g>

  <!-- Transaction -->
  <g transform="translate(600,50)">
    <text x="110" y="0" class="hdr">Transaction (MULTI/EXEC)</text>
    <rect x="0" y="20" width="220" height="24" class="cmd"/><text x="110" y="37" class="lbl">MULTI</text>
    <rect x="0" y="46" width="220" height="24" class="cmd"/><text x="110" y="63" class="lbl">SET a  (queued)</text>
    <rect x="0" y="72" width="220" height="24" class="cmd"/><text x="110" y="89" class="lbl">SET b  (queued)</text>
    <rect x="0" y="98" width="220" height="24" class="cmd"/><text x="110" y="115" class="lbl">SET c  (queued)</text>
    <rect x="0" y="124" width="220" height="24" class="cmd"/><text x="110" y="141" class="lbl">EXEC → runs all atomically</text>
    <text x="110" y="165" class="sub">Guaranteed no other client's</text>
    <text x="110" y="180" class="sub">commands interleave between them</text>
  </g>

  <text x="410" y="320" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Pipelining solves latency (fewer round trips). MULTI/EXEC solves isolation (atomic batch).
  </text>
  <text x="410" y="340" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    They're independent and often combined: pipeline a MULTI...EXEC block for both benefits at once.
  </text>
</svg>
