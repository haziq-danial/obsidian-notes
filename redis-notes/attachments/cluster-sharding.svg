<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Helvetica, Arial, sans-serif">
  <style>
    .node { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .replica { fill:#f5f5f5; stroke:#888; stroke-width:1.5; stroke-dasharray:4,3; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .slot { font-size:11px; fill:#c77a3a; text-anchor:middle; font-weight:bold; }
    .w { stroke:#444; stroke-width:1.3; fill:none; }
  </style>

  <text x="410" y="24" text-anchor="middle" font-size="16" font-weight="bold">Redis Cluster: 16384 Hash Slots Sharded Across Nodes</text>

  <!-- hash ring / slot bar -->
  <rect x="40" y="50" width="740" height="34" fill="#fff" stroke="#333"/>
  <rect x="40"  y="50" width="246" height="34" fill="#bbdefb"/>
  <rect x="286" y="50" width="248" height="34" fill="#c8e6c9"/>
  <rect x="534" y="50" width="246" height="34" fill="#ffe0b2"/>
  <text x="163" y="72" class="slot">slots 0 – 5460</text>
  <text x="410" y="72" class="slot">slots 5461 – 10922</text>
  <text x="657" y="72" class="slot">slots 10923 – 16383</text>

  <text x="410" y="105" text-anchor="middle" font-size="12" fill="#333">
    key → slot = CRC16(key) mod 16384      (use {hashtag} to force related keys into the same slot)
  </text>

  <!-- Node A -->
  <g transform="translate(60,140)">
    <rect x="0" y="0" width="180" height="60" rx="8" class="node"/>
    <text x="90" y="25" class="lbl">Node A (primary)</text>
    <text x="90" y="43" class="sub">owns slots 0–5460</text>
    <rect x="20" y="80" width="140" height="45" rx="8" class="replica"/>
    <text x="90" y="100" class="sub">Replica A1</text>
    <text x="90" y="115" class="sub">(standby copy)</text>
    <line x1="90" y1="60" x2="90" y2="80" class="w"/>
  </g>

  <!-- Node B -->
  <g transform="translate(320,140)">
    <rect x="0" y="0" width="180" height="60" rx="8" class="node"/>
    <text x="90" y="25" class="lbl">Node B (primary)</text>
    <text x="90" y="43" class="sub">owns slots 5461–10922</text>
    <rect x="20" y="80" width="140" height="45" rx="8" class="replica"/>
    <text x="90" y="100" class="sub">Replica B1</text>
    <text x="90" y="115" class="sub">(standby copy)</text>
    <line x1="90" y1="60" x2="90" y2="80" class="w"/>
  </g>

  <!-- Node C -->
  <g transform="translate(580,140)">
    <rect x="0" y="0" width="180" height="60" rx="8" class="node"/>
    <text x="90" y="25" class="lbl">Node C (primary)</text>
    <text x="90" y="43" class="sub">owns slots 10923–16383</text>
    <rect x="20" y="80" width="140" height="45" rx="8" class="replica"/>
    <text x="90" y="100" class="sub">Replica C1</text>
    <text x="90" y="115" class="sub">(standby copy)</text>
    <line x1="90" y1="60" x2="90" y2="80" class="w"/>
  </g>

  <text x="410" y="310" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    A client contacting the wrong node gets a MOVED redirect to the node that owns that key's slot.
  </text>
  <text x="410" y="330" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    If a primary fails, its replica is promoted automatically (cluster-internal failover, no separate Sentinel needed).
  </text>
  <text x="410" y="350" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Multi-key operations (MGET, transactions) only work atomically if all keys hash to the same slot.
  </text>
</svg>
