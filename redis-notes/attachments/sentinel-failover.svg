<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .master { fill:#fff3e0; stroke:#c77a3a; stroke-width:2; }
    .replica { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .sentinel { fill:#f5e9ff; stroke:#8a4fd1; stroke-width:2; }
    .down { fill:#ffebee; stroke:#c62828; stroke-width:2; stroke-dasharray:4,3; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#ar4); }
    .monitor { stroke:#8a4fd1; stroke-width:1.3; fill:none; stroke-dasharray:3,3; }
  </style>

  <text x="400" y="22" text-anchor="middle" font-size="16" font-weight="bold">Before Failover</text>

  <rect x="330" y="45" width="140" height="50" rx="6" class="master"/>
  <text x="400" y="75" class="lbl">Master</text>

  <rect x="150" y="140" width="130" height="50" rx="6" class="replica"/>
  <text x="215" y="170" class="lbl">Replica A</text>
  <rect x="530" y="140" width="130" height="50" rx="6" class="replica"/>
  <text x="595" y="170" class="lbl">Replica B</text>

  <path d="M350,95 L230,140" class="w"/>
  <path d="M450,95 L580,140" class="w"/>

  <rect x="60" y="230" width="90" height="36" rx="6" class="sentinel"/><text x="105" y="253" class="lbl" font-size="11">Sentinel 1</text>
  <rect x="360" y="230" width="90" height="36" rx="6" class="sentinel"/><text x="405" y="253" class="lbl" font-size="11">Sentinel 2</text>
  <rect x="660" y="230" width="90" height="36" rx="6" class="sentinel"/><text x="705" y="253" class="lbl" font-size="11">Sentinel 3</text>
  <path d="M105,230 Q250,140 330,70" class="monitor"/>
  <path d="M405,230 L400,95" class="monitor"/>
  <path d="M705,230 Q550,140 470,70" class="monitor"/>
  <text x="400" y="290" text-anchor="middle" class="sub">Sentinels continuously monitor master + replicas (PING) and gossip with each other</text>

  <line x1="20" y1="320" x2="780" y2="320" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="345" text-anchor="middle" font-size="16" font-weight="bold">After Master Fails → Automatic Failover</text>

  <rect x="330" y="365" width="140" height="45" rx="6" class="down"/>
  <text x="400" y="392" class="lbl" fill="#c62828">Master (DOWN)</text>

  <rect x="150" y="365" width="130" height="45" rx="6" class="master"/>
  <text x="215" y="392" class="lbl">Replica A → NEW MASTER</text>

  <text x="400" y="440" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Quorum of sentinels agrees master is down (objective down) → elects a leader sentinel → promotes the best replica →
  </text>
  <text x="400" y="455" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    reconfigures remaining replicas to follow it → notifies clients of the new master address.
  </text>
</svg>
