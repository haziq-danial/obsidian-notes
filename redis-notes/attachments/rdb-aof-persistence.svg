<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .mem { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .disk { fill:#ede7f6; stroke:#5e35b1; stroke-width:2; }
    .proc { fill:#fff3e0; stroke:#c77a3a; stroke-width:2; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.8; fill:none; marker-end:url(#ar2); }
  </style>

  <text x="420" y="24" text-anchor="middle" font-size="16" font-weight="bold">RDB vs AOF Persistence</text>

  <!-- Shared in-memory dataset -->
  <rect x="330" y="45" width="180" height="60" rx="8" class="mem"/>
  <text x="420" y="72" class="lbl">In-Memory Dataset</text>
  <text x="420" y="90" class="sub">(the live keyspace)</text>

  <!-- RDB path -->
  <g transform="translate(40,140)">
    <text x="150" y="0" class="lbl" font-weight="bold">RDB (snapshotting)</text>
    <rect x="30" y="20" width="240" height="50" rx="6" class="proc"/>
    <text x="150" y="42" class="lbl">fork() child process</text>
    <text x="150" y="58" class="sub">copy-on-write memory pages</text>
    <path d="M300,-90 L300,-10 L150,20" class="w" transform="translate(0,90)"/>
    <rect x="80" y="100" width="140" height="50" rx="6" class="disk"/>
    <text x="150" y="122" class="lbl">dump.rdb</text>
    <text x="150" y="138" class="sub">compact binary snapshot</text>
    <path d="M150,70 L150,100" class="w"/>
    <text x="150" y="175" class="sub">Triggered by: SAVE, BGSAVE,</text>
    <text x="150" y="190" class="sub">"save 900 1" rules, SHUTDOWN</text>
    <text x="150" y="215" class="sub" font-style="italic">Fast restart, compact, but can</text>
    <text x="150" y="230" class="sub" font-style="italic">lose data since last snapshot</text>
  </g>

  <!-- AOF path -->
  <g transform="translate(430,140)">
    <text x="180" y="0" class="lbl" font-weight="bold">AOF (append-only file)</text>
    <rect x="40" y="20" width="280" height="50" rx="6" class="proc"/>
    <text x="180" y="42" class="lbl">Every write command logged</text>
    <text x="180" y="58" class="sub">(as it happens, RESP format)</text>
    <path d="M180,-90 L180,-10 L180,20" class="w" transform="translate(0,90)"/>
    <rect x="60" y="100" width="240" height="50" rx="6" class="disk"/>
    <text x="180" y="122" class="lbl">appendonly.aof</text>
    <text x="180" y="138" class="sub">(base RDB + incr commands, RDB-preamble)</text>
    <path d="M180,70 L180,100" class="w"/>
    <text x="180" y="175" class="sub">fsync policy: always / everysec / no</text>
    <text x="180" y="195" class="sub">Rewritten (compacted) via BGREWRITEAOF</text>
    <text x="180" y="220" class="sub" font-style="italic">Much lower data-loss window,</text>
    <text x="180" y="235" class="sub" font-style="italic">larger files, slightly slower</text>
  </g>

  <text x="420" y="410" text-anchor="middle" font-size="12" fill="#333">
    Modern default: both enabled together — RDB for fast full restores/backups, AOF (everysec) to bound data loss to ~1s.
  </text>
</svg>
