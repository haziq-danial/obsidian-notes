<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .master { fill:#fff3e0; stroke:#c77a3a; stroke-width:2; }
    .replica { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .client { fill:#e8f5e9; stroke:#2e7d32; stroke-width:2; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.8; fill:none; marker-end:url(#ar3); }
    .repl { stroke:#c77a3a; stroke-width:2; fill:none; marker-end:url(#ar3); stroke-dasharray:5,3; }
  </style>

  <text x="390" y="24" text-anchor="middle" font-size="16" font-weight="bold">Primary-Replica Replication (Async)</text>

  <rect x="310" y="50" width="160" height="60" rx="8" class="master"/>
  <text x="390" y="76" class="lbl">Primary (Master)</text>
  <text x="390" y="94" class="sub">handles all writes</text>

  <rect x="60" y="180" width="150" height="60" rx="8" class="replica"/>
  <text x="135" y="206" class="lbl">Replica 1</text>
  <text x="135" y="224" class="sub">read-only</text>

  <rect x="315" y="180" width="150" height="60" rx="8" class="replica"/>
  <text x="390" y="206" class="lbl">Replica 2</text>
  <text x="390" y="224" class="sub">read-only</text>

  <rect x="570" y="180" width="150" height="60" rx="8" class="replica"/>
  <text x="645" y="206" class="lbl">Replica 3</text>
  <text x="645" y="224" class="sub">read-only</text>

  <path d="M330,110 L150,180" class="repl"/>
  <path d="M390,110 L390,180" class="repl"/>
  <path d="M450,110 L620,180" class="repl"/>
  <text x="230" y="150" class="sub">replicate</text>
  <text x="410" y="145" class="sub">command</text>
  <text x="560" y="150" class="sub">stream</text>

  <rect x="330" y="300" width="120" height="40" rx="6" class="client"/>
  <text x="390" y="325" class="lbl">Client (writes)</text>
  <path d="M390,300 L390,110" class="w"/>

  <rect x="60" y="300" width="120" height="40" rx="6" class="client"/>
  <text x="120" y="325" class="lbl">Client (reads)</text>
  <path d="M120,300 L135,240" class="w"/>

  <rect x="600" y="300" width="120" height="40" rx="6" class="client"/>
  <text x="660" y="325" class="lbl">Client (reads)</text>
  <path d="M660,300 L645,240" class="w"/>

  <text x="390" y="368" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Replication is asynchronous by default — replicas may lag; scale reads horizontally, not writes.
  </text>
</svg>
