<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .goroutine { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .chan { fill:#fff3e0; stroke:#c77a3a; stroke-width:2; }
    .slot-full { fill:#c8e6c9; stroke:#2e7d32; stroke-width:1.3; }
    .slot-empty { fill:#f5f5f5; stroke:#999; stroke-width:1.3; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#ar4); }
    .code { font-family: monospace; font-size:11px; fill:#111; text-anchor:middle; }
  </style>

  <text x="430" y="24" text-anchor="middle" font-size="16" font-weight="bold">Channels: Unbuffered vs Buffered, and select</text>

  <!-- Unbuffered -->
  <g transform="translate(30,50)">
    <text x="180" y="0" class="lbl" font-weight="bold">Unbuffered: ch := make(chan int)</text>
    <rect x="0" y="20" width="110" height="45" rx="6" class="goroutine"/>
    <text x="55" y="47" class="lbl" font-size="12">Sender</text>
    <rect x="150" y="20" width="120" height="45" rx="20" class="chan"/>
    <text x="210" y="47" class="code">rendezvous</text>
    <rect x="310" y="20" width="110" height="45" rx="6" class="goroutine"/>
    <text x="365" y="47" class="lbl" font-size="12">Receiver</text>
    <path d="M110,42 L150,42" class="w"/>
    <path d="M270,42 L310,42" class="w"/>
    <text x="180" y="90" class="sub">send BLOCKS until a receiver is ready to</text>
    <text x="180" y="105" class="sub">receive at that exact instant — direct handoff</text>
  </g>

  <!-- Buffered -->
  <g transform="translate(480,50)">
    <text x="160" y="0" class="lbl" font-weight="bold">Buffered: make(chan int, 3)</text>
    <rect x="0" y="20" width="100" height="45" rx="6" class="goroutine"/>
    <text x="50" y="47" class="lbl" font-size="12">Sender</text>
    <rect x="130" y="15" width="45" height="55" class="slot-full"/><text x="152" y="47" class="lbl" font-size="10">A</text>
    <rect x="175" y="15" width="45" height="55" class="slot-full"/><text x="197" y="47" class="lbl" font-size="10">B</text>
    <rect x="220" y="15" width="45" height="55" class="slot-empty"/><text x="242" y="47" class="lbl" font-size="10">·</text>
    <path d="M100,42 L130,42" class="w"/>
    <text x="197" y="90" class="sub">send only blocks once all 3 slots are full;</text>
    <text x="197" y="105" class="sub">receiver drains independently, no rendezvous needed</text>
  </g>

  <!-- select -->
  <g transform="translate(150,220)">
    <text x="280" y="0" class="lbl" font-weight="bold">select: wait on multiple channel operations at once</text>
    <rect x="0" y="20" width="180" height="40" rx="6" class="chan"/>
    <text x="90" y="45" class="code">case v := &lt;-ch1:</text>
    <rect x="200" y="20" width="180" height="40" rx="6" class="chan"/>
    <text x="290" y="45" class="code">case ch2 &lt;- x:</text>
    <rect x="400" y="20" width="160" height="40" rx="6" class="chan"/>
    <text x="480" y="45" class="code">default:</text>
    <path d="M90,85 L280,110" class="w"/>
    <path d="M290,85 L280,110" class="w"/>
    <path d="M480,85 L280,110" class="w"/>
    <rect x="200" y="110" width="160" height="45" rx="6" class="goroutine"/>
    <text x="280" y="137" class="sub">first ready case runs</text>
  </g>

  <text x="430" y="410" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Without a "default" case, select blocks until at least one case is ready — a multi-way, non-deterministic
  </text>
  <text x="430" y="428" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    choice among whichever channel operations happen to be ready first.
  </text>
</svg>
