<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ar6" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .normal { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .defer { fill:#fff3e0; stroke:#c77a3a; stroke-width:2; }
    .panic { fill:#ffebee; stroke:#c62828; stroke-width:2; }
    .recover { fill:#e8f5e9; stroke:#2e7d32; stroke-width:2; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#ar6); }
  </style>

  <text x="410" y="24" text-anchor="middle" font-size="16" font-weight="bold">defer, panic, and recover</text>

  <rect x="30" y="55" width="170" height="45" rx="6" class="normal"/>
  <text x="115" y="82" class="lbl">Function body runs</text>

  <rect x="250" y="55" width="170" height="45" rx="6" class="panic"/>
  <text x="335" y="82" class="lbl">panic("boom")</text>

  <rect x="470" y="55" width="170" height="45" rx="6" class="panic"/>
  <text x="555" y="82" class="lbl">Normal flow STOPS</text>

  <path d="M200,77 L250,77" class="w"/>
  <path d="M420,77 L470,77" class="w"/>

  <text x="410" y="130" text-anchor="middle" font-size="13" font-weight="bold">Deferred calls still run, in LIFO order, as the stack unwinds</text>

  <rect x="60" y="155" width="180" height="45" rx="6" class="defer"/>
  <text x="150" y="182" class="lbl" font-size="12">defer C() runs</text>

  <rect x="320" y="155" width="180" height="45" rx="6" class="defer"/>
  <text x="410" y="182" class="lbl" font-size="12">defer B() runs</text>

  <rect x="580" y="155" width="180" height="45" rx="6" class="defer"/>
  <text x="670" y="182" class="lbl" font-size="12">defer A() runs</text>

  <path d="M555,100 L150,155" class="w"/>
  <path d="M240,177 L320,177" class="w"/>
  <path d="M500,177 L580,177" class="w"/>

  <text x="410" y="225" text-anchor="middle" font-size="11" fill="#555">(deferred in program order A, B, C → executed in reverse: C, B, A)</text>

  <text x="410" y="270" text-anchor="middle" font-size="13" font-weight="bold">If a deferred function calls recover(), unwinding stops there</text>

  <rect x="250" y="290" width="320" height="55" rx="6" class="recover"/>
  <text x="410" y="315" class="lbl">defer func() { if r := recover(); r != nil { ... } }()</text>
  <text x="410" y="333" class="sub">panic is caught; function returns normally to ITS caller</text>
  <path d="M670,200 L500,290" class="w"/>

  <text x="410" y="390" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    recover() only has an effect when called directly inside a deferred function — calling it anywhere
  </text>
  <text x="410" y="408" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    else (including a function that a deferred function merely calls) returns nil and does nothing.
  </text>
  <text x="410" y="430" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Recovery only stops the panic in the goroutine that's unwinding — it does not resume execution
    after the panic() call itself.
  </text>
</svg>
