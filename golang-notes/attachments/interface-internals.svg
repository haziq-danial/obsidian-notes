<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="840" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .iface { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .typ { fill:#fff3e0; stroke:#c77a3a; stroke-width:2; }
    .val { fill:#e8f5e9; stroke:#2e7d32; stroke-width:2; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#ar5); }
    .code { font-family: monospace; font-size:12px; fill:#111; }
  </style>

  <text x="420" y="24" text-anchor="middle" font-size="16" font-weight="bold">What an Interface Value Actually Is</text>

  <text x="40" y="55" class="code">var w io.Writer = os.Stdout   // interface value holding a *os.File</text>

  <!-- interface value = two words -->
  <g transform="translate(150,90)">
    <text x="130" y="-10" class="lbl" font-weight="bold">Interface value (two words)</text>
    <rect x="0" y="0" width="260" height="55" rx="8" class="iface"/>
    <rect x="0" y="0" width="130" height="55" rx="0" class="iface"/>
    <text x="65" y="32" class="sub">type descriptor</text>
    <text x="195" y="32" class="sub">data pointer</text>
  </g>

  <path d="M215,145 L150,210" class="w"/>
  <path d="M345,145 L560,210" class="w"/>

  <!-- type descriptor -->
  <g transform="translate(30,210)">
    <rect x="0" y="0" width="240" height="70" rx="8" class="typ"/>
    <text x="120" y="28" class="lbl">*os.File's type info</text>
    <text x="120" y="48" class="sub">method table: Write, Read, Close…</text>
  </g>

  <!-- data pointer target -->
  <g transform="translate(440,210)">
    <rect x="0" y="0" width="240" height="70" rx="8" class="val"/>
    <text x="120" y="28" class="lbl">the actual *os.File</text>
    <text x="120" y="48" class="sub">(points to stdout's file descriptor)</text>
  </g>

  <text x="420" y="330" text-anchor="middle" font-size="13" font-weight="bold">Calling w.Write(...) is a lookup through the type descriptor's method table</text>
  <text x="40" y="355" class="code">w.Write(b)  →  find Write in type descriptor's table  →  call it with the data pointer as receiver</text>

  <text x="420" y="395" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    A nil concrete pointer stored in a non-nil interface is a classic gotcha: the interface itself is
  </text>
  <text x="420" y="413" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    NOT nil (it has a type descriptor), even though the data pointer inside it is nil.
  </text>
</svg>
