<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="840" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ar9" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .file { fill:#fff3e0; stroke:#c77a3a; stroke-width:2; }
    .cmd { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .net { fill:#e8f5e9; stroke:#2e7d32; stroke-width:2; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#ar9); }
    .code { font-family: monospace; font-size:11px; fill:#111; text-anchor:middle; }
  </style>

  <text x="420" y="24" text-anchor="middle" font-size="16" font-weight="bold">Go Modules: Dependency Resolution</text>

  <rect x="40" y="55" width="180" height="55" rx="6" class="cmd"/>
  <text x="130" y="80" class="lbl" font-size="12">go get example.com/pkg</text>
  <text x="130" y="98" class="sub">or: import in source + go mod tidy</text>

  <path d="M220,82 L300,82" class="w"/>

  <rect x="300" y="55" width="200" height="55" rx="6" class="net"/>
  <text x="400" y="80" class="lbl" font-size="12">Module proxy / VCS</text>
  <text x="400" y="98" class="sub">resolves version, downloads source</text>

  <path d="M500,82 L580,82" class="w"/>

  <rect x="580" y="55" width="200" height="55" rx="6" class="file"/>
  <text x="680" y="80" class="lbl" font-size="12">Local module cache</text>
  <text x="680" y="98" class="sub">$GOMODCACHE, content-hashed</text>

  <text x="420" y="160" text-anchor="middle" font-size="13" font-weight="bold">Two files record the result — both should be committed</text>

  <rect x="80" y="185" width="300" height="90" rx="8" class="file"/>
  <text x="230" y="210" class="lbl">go.mod</text>
  <text x="230" y="230" class="sub">module name, Go version,</text>
  <text x="230" y="245" class="sub">direct dependency requirements</text>
  <text x="230" y="262" class="code">require example.com/pkg v1.4.0</text>

  <rect x="440" y="185" width="320" height="90" rx="8" class="file"/>
  <text x="600" y="210" class="lbl">go.sum</text>
  <text x="600" y="230" class="sub">cryptographic checksums for every</text>
  <text x="600" y="245" class="sub">module version in the full dep graph</text>
  <text x="600" y="262" class="code">verifies downloads haven't been tampered with</text>

  <text x="420" y="330" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Semantic Import Versioning: a v2+ module encodes its major version in the import path itself
  </text>
  <text x="420" y="348" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    (example.com/pkg/v2), so incompatible major versions can even coexist in one build.
  </text>
  <text x="420" y="370" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Minimal Version Selection: Go picks the MINIMUM version satisfying every module's stated requirement,
  </text>
  <text x="420" y="388" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    not automatically the newest — builds stay reproducible until something explicitly asks for more.
  </text>
</svg>
