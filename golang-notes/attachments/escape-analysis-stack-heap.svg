<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="840" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar7" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .fn { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .stack { fill:#e8f5e9; stroke:#2e7d32; stroke-width:2; }
    .heap { fill:#fff3e0; stroke:#c77a3a; stroke-width:2; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#ar7); }
    .code { font-family: monospace; font-size:12px; fill:#111; }
  </style>

  <text x="420" y="24" text-anchor="middle" font-size="16" font-weight="bold">Escape Analysis: Who Decides Stack vs Heap?</text>

  <text x="420" y="50" text-anchor="middle" font-size="12" fill="#555">The compiler decides — not the programmer, and not `new` vs a literal</text>

  <!-- stays on stack -->
  <g transform="translate(50,80)">
    <text x="160" y="0" class="lbl" font-weight="bold">Stays on the stack</text>
    <rect x="0" y="15" width="320" height="60" rx="6" class="fn"/>
    <text x="160" y="40" class="code">func sum() int {</text>
    <text x="160" y="58" class="code">  x := 5; return x * 2 }</text>
    <path d="M160,75 L160,110" class="w"/>
    <rect x="60" y="110" width="200" height="55" rx="6" class="stack"/>
    <text x="160" y="135" class="lbl" font-size="12">x lives on the</text>
    <text x="160" y="152" class="lbl" font-size="12">calling goroutine's stack</text>
    <text x="160" y="195" class="sub">x's address never leaves sum() —</text>
    <text x="160" y="210" class="sub">popped automatically when it returns</text>
  </g>

  <!-- escapes to heap -->
  <g transform="translate(470,80)">
    <text x="160" y="0" class="lbl" font-weight="bold">Escapes to the heap</text>
    <rect x="0" y="15" width="320" height="60" rx="6" class="fn"/>
    <text x="160" y="40" class="code">func makeX() *int {</text>
    <text x="160" y="58" class="code">  x := 5; return &amp;x }</text>
    <path d="M160,75 L160,110" class="w"/>
    <rect x="60" y="110" width="200" height="55" rx="6" class="heap"/>
    <text x="160" y="135" class="lbl" font-size="12">x is heap-allocated,</text>
    <text x="160" y="152" class="lbl" font-size="12">GC-managed</text>
    <text x="160" y="195" class="sub">x's address is returned to the caller —</text>
    <text x="160" y="210" class="sub">must outlive makeX()'s own stack frame</text>
  </g>

  <text x="420" y="345" text-anchor="middle" font-size="13" font-weight="bold">Check the compiler's actual decision:</text>
  <text x="420" y="368" text-anchor="middle" class="code">go build -gcflags="-m" ./...</text>

  <text x="420" y="405" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    A value "escapes" whenever the compiler can't prove its lifetime is confined to the current stack frame —
  </text>
  <text x="420" y="423" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    e.g. its address is returned, stored in a longer-lived struct, or captured by an escaping closure.
  </text>
</svg>
