<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="840" height="480" fill="#ffffff"/>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .hdr { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .cell { fill:#fff3e0; stroke:#c77a3a; stroke-width:1.5; }
    .used { fill:#c8e6c9; stroke:#2e7d32; stroke-width:1.5; }
    .free { fill:#f5f5f5; stroke:#999; stroke-width:1.5; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .w { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#ar2); }
    .code { font-family: monospace; font-size:12px; fill:#111; }
  </style>

  <text x="420" y="24" text-anchor="middle" font-size="16" font-weight="bold">Slice Header and the Underlying Array</text>

  <text x="40" y="55" class="code">s := make([]int, 3, 5)   // len=3, cap=5</text>

  <!-- slice header -->
  <g transform="translate(40,80)">
    <text x="105" y="0" class="lbl" font-weight="bold">Slice header (s)</text>
    <rect x="0" y="15" width="70" height="40" class="hdr"/>
    <text x="35" y="39" class="lbl" font-size="11">ptr</text>
    <rect x="70" y="15" width="70" height="40" class="hdr"/>
    <text x="105" y="39" class="lbl" font-size="11">len: 3</text>
    <rect x="140" y="15" width="70" height="40" class="hdr"/>
    <text x="175" y="39" class="lbl" font-size="11">cap: 5</text>
  </g>

  <!-- underlying array -->
  <g transform="translate(40,190)">
    <text x="175" y="-15" class="lbl" font-weight="bold">Underlying array</text>
    <rect x="0"   y="0" width="70" height="40" class="used"/><text x="35" y="24" class="lbl">0</text>
    <rect x="70"  y="0" width="70" height="40" class="used"/><text x="105" y="24" class="lbl">0</text>
    <rect x="140" y="0" width="70" height="40" class="used"/><text x="175" y="24" class="lbl">0</text>
    <rect x="210" y="0" width="70" height="40" class="free"/><text x="245" y="24" class="lbl" fill="#999">·</text>
    <rect x="280" y="0" width="70" height="40" class="free"/><text x="315" y="24" class="lbl" fill="#999">·</text>
    <text x="105" y="60" class="sub">len: elements 0–2 are usable (s[0], s[1], s[2])</text>
    <text x="280" y="60" class="sub">cap: 2 more slots reserved,</text>
    <text x="280" y="75" class="sub">reachable via re-slicing (s[:5])</text>
  </g>
  <path d="M75,120 L75,190" class="w"/>

  <text x="420" y="300" text-anchor="middle" font-size="13" font-weight="bold">append() within capacity: reuses the same array, no allocation</text>
  <text x="40" y="325" class="code">s = append(s, 9)   // len becomes 4, still ≤ cap(5) → same backing array</text>

  <text x="420" y="365" text-anchor="middle" font-size="13" font-weight="bold">append() beyond capacity: allocates a NEW, larger array and copies</text>
  <text x="40" y="390" class="code">s = append(s, 1, 2, 3)   // len would exceed cap → new array (grown), old one untouched</text>

  <text x="420" y="430" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    This is why two slices can appear to "alias" the same data after slicing, but silently diverge
  </text>
  <text x="420" y="450" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    the moment one of them appends past its capacity and gets reallocated onto a new array.
  </text>
</svg>
