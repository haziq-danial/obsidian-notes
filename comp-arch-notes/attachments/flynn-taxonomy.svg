<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <style>
    .box { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .pu { fill:#fff3e0; stroke:#c77a3a; stroke-width:1.5; }
    .lbl { font-size:14px; fill:#111; text-anchor:middle; font-weight:bold; }
    .sub { font-size:11px; fill:#444; text-anchor:middle; }
    .arr { stroke:#333; stroke-width:1.5; marker-end:url(#fa); }
  </style>
  <defs>
    <marker id="fa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="380" y="20" text-anchor="middle" font-size="16" font-weight="bold">Flynn's Taxonomy</text>

  <!-- SISD -->
  <g transform="translate(30,50)">
    <rect x="0" y="0" width="150" height="150" rx="8" class="box"/>
    <text x="75" y="20" class="lbl">SISD</text>
    <text x="75" y="35" class="sub">Single Instruction,</text>
    <text x="75" y="47" class="sub">Single Data</text>
    <rect x="55" y="70" width="40" height="30" class="pu"/>
    <text x="75" y="90" class="sub">PU</text>
    <line x1="20" y1="85" x2="55" y2="85" class="arr"/>
    <text x="35" y="78" class="sub">I</text>
    <line x1="75" y1="140" x2="75" y2="100" class="arr" transform="rotate(180,75,120)"/>
    <text x="75" y="135" class="sub">classic single-core CPU</text>
  </g>

  <!-- SIMD -->
  <g transform="translate(210,50)">
    <rect x="0" y="0" width="170" height="150" rx="8" class="box"/>
    <text x="85" y="20" class="lbl">SIMD</text>
    <text x="85" y="35" class="sub">Single Instruction,</text>
    <text x="85" y="47" class="sub">Multiple Data</text>
    <rect x="20" y="65" width="35" height="25" class="pu"/>
    <rect x="68" y="65" width="35" height="25" class="pu"/>
    <rect x="116" y="65" width="35" height="25" class="pu"/>
    <text x="85" y="82" class="sub"> </text>
    <line x1="10" y1="55" x2="130" y2="55" stroke="#333" stroke-width="1.3"/>
    <text x="85" y="120" class="sub">GPUs, vector/AVX units</text>
  </g>

  <!-- MISD -->
  <g transform="translate(410,50)">
    <rect x="0" y="0" width="150" height="150" rx="8" class="box"/>
    <text x="75" y="20" class="lbl">MISD</text>
    <text x="75" y="35" class="sub">Multiple Instruction,</text>
    <text x="75" y="47" class="sub">Single Data</text>
    <rect x="55" y="60" width="40" height="20" class="pu"/>
    <rect x="55" y="85" width="40" height="20" class="pu"/>
    <rect x="55" y="110" width="40" height="20" class="pu"/>
    <text x="75" y="140" class="sub">rare — fault-tolerant systems</text>
  </g>

  <!-- MIMD -->
  <g transform="translate(590,50)">
    <rect x="0" y="0" width="150" height="150" rx="8" class="box"/>
    <text x="75" y="20" class="lbl">MIMD</text>
    <text x="75" y="35" class="sub">Multiple Instruction,</text>
    <text x="75" y="47" class="sub">Multiple Data</text>
    <rect x="20" y="60" width="30" height="22" class="pu"/>
    <rect x="60" y="60" width="30" height="22" class="pu"/>
    <rect x="20" y="90" width="30" height="22" class="pu"/>
    <rect x="60" y="90" width="30" height="22" class="pu"/>
    <text x="75" y="140" class="sub">multicore CPUs, clusters</text>
  </g>

  <text x="380" y="240" text-anchor="middle" font-size="12" fill="#333">
    Classification is by (# instruction streams) × (# data streams). Modern multicore CPUs with vector units are MIMD machines
  </text>
  <text x="380" y="260" text-anchor="middle" font-size="12" fill="#333">
    built from SIMD-capable cores.
  </text>
</svg>
