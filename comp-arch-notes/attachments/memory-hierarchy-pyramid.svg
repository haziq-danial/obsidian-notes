<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>
  <style>
    .lbl { font-size:14px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#333; text-anchor:middle; }
    .side { font-size:12px; fill:#444; }
  </style>

  <!-- pyramid levels, top = smallest/fastest (shifted +40 right of original to clear the left axis labels) -->
  <polygon points="420,20 500,80 340,80" fill="#c62828" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="420" y="58" class="lbl" fill="white">Registers</text>

  <polygon points="340,80 500,80 540,140 300,140" fill="#e65100" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="420" y="118" class="lbl" fill="white">L1 Cache</text>

  <polygon points="300,140 540,140 580,200 260,200" fill="#f9a825" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="420" y="178" class="lbl">L2 Cache</text>

  <polygon points="260,200 580,200 620,260 220,260" fill="#9ccc65" stroke="#33691e" stroke-width="1.5"/>
  <text x="420" y="238" class="lbl">L3 Cache (shared)</text>

  <polygon points="220,260 620,260 670,330 170,330" fill="#4fc3f7" stroke="#01579b" stroke-width="1.5"/>
  <text x="420" y="303" class="lbl">Main Memory (DRAM)</text>

  <polygon points="170,330 670,330 730,410 110,410" fill="#7986cb" stroke="#1a237e" stroke-width="1.5"/>
  <text x="420" y="378" class="lbl" fill="white">Secondary Storage (SSD / HDD)</text>

  <polygon points="110,410 730,410 770,450 70,450" fill="#546e7a" stroke="#263238" stroke-width="1.5"/>
  <text x="420" y="434" class="lbl" fill="white">Remote / Cloud / Tape (offline)</text>

  <!-- Left axis: speed (kept clear of the pyramid's widest tier, which now starts at x=70) -->
  <text x="20" y="45" class="side" font-weight="bold">Faster</text>
  <line x1="20" y1="55" x2="20" y2="420" stroke="#333" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="20" y="435" class="side" font-weight="bold">Slower</text>

  <!-- Right axis: capacity / cost -->
  <text x="740" y="45" class="side" font-weight="bold" text-anchor="end">Costlier / bit</text>
  <text x="740" y="435" class="side" font-weight="bold" text-anchor="end">Cheaper / bit, larger</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="410" y="16" text-anchor="middle" font-size="16" font-weight="bold">Memory Hierarchy Pyramid</text>
</svg>
