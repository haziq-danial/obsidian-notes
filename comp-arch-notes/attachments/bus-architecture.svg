<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#eef4ff; stroke:#3a6bc7; stroke-width:2; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .busline { stroke:#333; stroke-width:3; }
    .tag { font-size:11px; fill:#555; text-anchor:middle; }
  </style>

  <rect x="30" y="20" width="140" height="50" rx="6" class="box"/>
  <text x="100" y="50" class="lbl">CPU</text>

  <rect x="320" y="20" width="140" height="50" rx="6" class="box"/>
  <text x="390" y="50" class="lbl">Main Memory</text>

  <rect x="610" y="20" width="140" height="50" rx="6" class="box"/>
  <text x="680" y="50" class="lbl">GPU / Cache Ctrl</text>

  <!-- Address bus -->
  <line x1="40" y1="110" x2="740" y2="110" class="busline" stroke="#1565c0"/>
  <text x="390" y="100" class="tag">Address Bus</text>
  <line x1="100" y1="70" x2="100" y2="110" stroke="#1565c0" stroke-width="2"/>
  <line x1="390" y1="70" x2="390" y2="110" stroke="#1565c0" stroke-width="2"/>
  <line x1="680" y1="70" x2="680" y2="110" stroke="#1565c0" stroke-width="2"/>

  <!-- Data bus -->
  <line x1="40" y1="160" x2="740" y2="160" class="busline" stroke="#2e7d32"/>
  <text x="390" y="150" class="tag">Data Bus</text>
  <line x1="100" y1="70" x2="100" y2="160" stroke="#2e7d32" stroke-width="2" stroke-dasharray="0"/>
  <line x1="390" y1="70" x2="390" y2="160" stroke="#2e7d32" stroke-width="2"/>
  <line x1="680" y1="70" x2="680" y2="160" stroke="#2e7d32" stroke-width="2"/>

  <!-- Control bus -->
  <line x1="40" y1="210" x2="740" y2="210" class="busline" stroke="#c62828"/>
  <text x="390" y="200" class="tag">Control Bus (R/W, Clock, Interrupts, Bus-Grant)</text>
  <line x1="100" y1="70" x2="100" y2="210" stroke="#c62828" stroke-width="2"/>
  <line x1="390" y1="70" x2="390" y2="210" stroke="#c62828" stroke-width="2"/>
  <line x1="680" y1="70" x2="680" y2="210" stroke="#c62828" stroke-width="2"/>

  <rect x="150" y="250" width="140" height="50" rx="6" class="box"/>
  <text x="220" y="280" class="lbl">I/O Controller</text>
  <line x1="220" y1="210" x2="220" y2="250" stroke="#333" stroke-width="2"/>

  <rect x="470" y="250" width="140" height="50" rx="6" class="box"/>
  <text x="540" y="280" class="lbl">DMA Controller</text>
  <line x1="540" y1="210" x2="540" y2="250" stroke="#333" stroke-width="2"/>

  <text x="390" y="16" text-anchor="middle" font-size="16" font-weight="bold">System Bus: Address / Data / Control</text>
</svg>
