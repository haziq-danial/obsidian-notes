<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
  <style>
    .box { fill:#eef4ff; stroke:#3a6bc7; stroke-width:1.5; }
    .variant { fill:#fff3e0; stroke:#c77a3a; stroke-width:1.5; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .code { font-family: monospace; font-size:12px; fill:#111; }
    .hdr { font-size:15px; font-weight:bold; fill:#111; text-anchor:middle; }
  </style>

  <text x="410" y="22" text-anchor="middle" font-size="16" font-weight="bold">Enums: One Type, Several Shapes</text>

  <text x="40" y="55" class="code">enum Shape {</text>
  <text x="40" y="73" class="code">    Circle(f64),</text>
  <text x="40" y="91" class="code">    Rectangle { width: f64, height: f64 },</text>
  <text x="40" y="109" class="code">    Triangle(f64, f64, f64),</text>
  <text x="40" y="127" class="code">}</text>

  <g transform="translate(40,150)">
    <text x="115" y="0" class="hdr">One value, one variant at a time</text>
    <rect x="0" y="15" width="230" height="50" rx="6" class="box"/>
    <text x="115" y="45" class="lbl">Shape::Circle(3.0)</text>

    <rect x="270" y="15" width="230" height="50" rx="6" class="variant"/>
    <text x="385" y="38" class="lbl" font-size="11">Shape::Rectangle</text>
    <text x="385" y="54" class="lbl" font-size="11">{ width:2.0, height:4.0 }</text>

    <rect x="540" y="15" width="230" height="50" rx="6" class="box"/>
    <text x="655" y="45" class="lbl">Shape::Triangle(3,4,5)</text>
  </g>

  <text x="410" y="240" text-anchor="middle" font-size="14" font-weight="bold">match forces you to handle every variant — exhaustively, checked at compile time</text>

  <text x="40" y="270" class="code">fn area(s: &amp;Shape) -&gt; f64 {</text>
  <text x="40" y="288" class="code">    match s {</text>
  <text x="40" y="306" class="code">        Shape::Circle(r) =&gt; std::f64::consts::PI * r * r,</text>
  <text x="40" y="324" class="code">        Shape::Rectangle { width, height } =&gt; width * height,</text>
  <text x="40" y="342" class="code">        Shape::Triangle(a, b, c) =&gt; { /* Heron's formula */ 0.0 }</text>
  <text x="40" y="360" class="code">        // omitting a variant here is a COMPILE ERROR, not a runtime surprise</text>
  <text x="40" y="378" class="code">    }</text>
  <text x="40" y="396" class="code">}</text>
</svg>
