<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .box { fill:#eef4ff; stroke:#3a6bc7; stroke-width:1.5; }
    .pending { fill:#ffebee; stroke:#c62828; stroke-width:1.5; }
    .ready { fill:#e8f5e9; stroke:#2e7d32; stroke-width:1.5; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .code { font-family: monospace; font-size:12px; fill:#111; }
    .w { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#ar4); }
  </style>

  <text x="420" y="22" text-anchor="middle" font-size="16" font-weight="bold">async/await: Compiled into a State Machine (Future)</text>

  <text x="40" y="55" class="code">async fn fetch_and_process() -&gt; String {</text>
  <text x="40" y="73" class="code">    let data = fetch_data().await;   // suspend point 1</text>
  <text x="40" y="91" class="code">    let parsed = parse(data).await;  // suspend point 2</text>
  <text x="40" y="109" class="code">    parsed</text>
  <text x="40" y="127" class="code">}</text>

  <!-- state machine -->
  <g transform="translate(60,150)">
    <rect x="0" y="0" width="160" height="50" rx="8" class="box"/>
    <text x="80" y="30" class="lbl">State: Start</text>

    <rect x="220" y="0" width="160" height="50" rx="8" class="pending"/>
    <text x="300" y="22" class="lbl" font-size="11">Awaiting fetch_data()</text>
    <text x="300" y="38" class="lbl" font-size="11">Poll::Pending</text>

    <rect x="440" y="0" width="160" height="50" rx="8" class="pending"/>
    <text x="520" y="22" class="lbl" font-size="11">Awaiting parse()</text>
    <text x="520" y="38" class="lbl" font-size="11">Poll::Pending</text>

    <rect x="660" y="0" width="160" height="50" rx="8" class="ready"/>
    <text x="740" y="22" class="lbl" font-size="11">Done</text>
    <text x="740" y="38" class="lbl" font-size="11">Poll::Ready(value)</text>

    <path d="M160,25 L220,25" class="w"/>
    <path d="M380,25 L440,25" class="w"/>
    <path d="M600,25 L660,25" class="w"/>
  </g>

  <text x="420" y="240" text-anchor="middle" font-size="13" font-weight="bold">The executor drives this state machine by repeatedly calling poll()</text>

  <g transform="translate(140,260)">
    <rect x="0" y="0" width="180" height="50" rx="8" class="box"/>
    <text x="90" y="30" class="lbl">Executor (tokio)</text>

    <rect x="300" y="0" width="180" height="50" rx="8" class="box"/>
    <text x="390" y="22" class="lbl" font-size="12">Future::poll()</text>
    <text x="390" y="38" class="sub">returns Pending or Ready</text>

    <rect x="600" y="0" width="180" height="50" rx="8" class="box"/>
    <text x="690" y="22" class="lbl" font-size="12">Waker</text>
    <text x="690" y="38" class="sub">notifies executor when</text>

    <path d="M180,25 L300,25" class="w"/>
    <path d="M480,25 L600,25" class="w"/>
    <path d="M690,50 Q690,90 90,90 Q90,90 90,50" class="w"/>
  </g>

  <text x="420" y="390" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    On Pending, the executor parks the task and runs other ready tasks — this is how thousands of
  </text>
  <text x="420" y="408" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    concurrent async tasks run on just a handful of OS threads, unlike one-OS-thread-per-task models.
  </text>
</svg>
