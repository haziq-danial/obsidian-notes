<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#eef4ff; stroke:#3a6bc7; stroke-width:1.5; }
    .lbl { font-size:13px; fill:#111; text-anchor:middle; }
    .hdr { font-size:15px; font-weight:bold; fill:#111; text-anchor:middle; }
    .sub { font-size:11px; fill:#555; text-anchor:middle; }
    .code { font-family: monospace; font-size:11px; fill:#111; text-anchor:middle; }
  </style>

  <text x="450" y="22" text-anchor="middle" font-size="16" font-weight="bold">Smart Pointers at a Glance</text>

  <!-- Box -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="200" height="150" rx="8" class="box"/>
    <text x="100" y="24" class="hdr">Box&lt;T&gt;</text>
    <text x="100" y="46" class="code">Box::new(5)</text>
    <text x="100" y="70" class="sub">single owner</text>
    <text x="100" y="86" class="sub">heap allocation</text>
    <text x="100" y="102" class="sub">no runtime cost</text>
    <text x="100" y="122" class="sub">recursive types,</text>
    <text x="100" y="136" class="sub">trait objects</text>
  </g>

  <!-- Rc -->
  <g transform="translate(240,50)">
    <rect x="0" y="0" width="200" height="150" rx="8" class="box"/>
    <text x="100" y="24" class="hdr">Rc&lt;T&gt;</text>
    <text x="100" y="46" class="code">Rc::new(5)</text>
    <text x="100" y="70" class="sub">multiple owners</text>
    <text x="100" y="86" class="sub">ref-counted</text>
    <text x="100" y="102" class="sub">single-threaded only</text>
    <text x="100" y="122" class="sub">shared read-only</text>
    <text x="100" y="136" class="sub">data (e.g. trees, graphs)</text>
  </g>

  <!-- Arc -->
  <g transform="translate(460,50)">
    <rect x="0" y="0" width="200" height="150" rx="8" class="box"/>
    <text x="100" y="24" class="hdr">Arc&lt;T&gt;</text>
    <text x="100" y="46" class="code">Arc::new(5)</text>
    <text x="100" y="70" class="sub">multiple owners</text>
    <text x="100" y="86" class="sub">atomic ref-count</text>
    <text x="100" y="102" class="sub">thread-safe (Send+Sync)</text>
    <text x="100" y="122" class="sub">shared data across</text>
    <text x="100" y="136" class="sub">threads</text>
  </g>

  <!-- RefCell -->
  <g transform="translate(680,50)">
    <rect x="0" y="0" width="200" height="150" rx="8" class="box"/>
    <text x="100" y="24" class="hdr">RefCell&lt;T&gt;</text>
    <text x="100" y="46" class="code">RefCell::new(5)</text>
    <text x="100" y="70" class="sub">interior mutability</text>
    <text x="100" y="86" class="sub">borrow rules checked</text>
    <text x="100" y="102" class="sub">at RUNTIME, not compile</text>
    <text x="100" y="122" class="sub">panics on violation</text>
    <text x="100" y="136" class="sub">(single-threaded only)</text>
  </g>

  <!-- Combined pattern -->
  <g transform="translate(150,240)">
    <text x="300" y="0" class="hdr">Common combination: Rc&lt;RefCell&lt;T&gt;&gt; — shared AND mutable (single-threaded)</text>
    <rect x="100" y="20" width="400" height="60" rx="8" fill="#fff3e0" stroke="#c77a3a" stroke-width="1.5"/>
    <text x="300" y="45" class="code" font-size="13">Rc::new(RefCell::new(data))</text>
    <text x="300" y="65" class="sub">multiple owners, each can mutate through borrow_mut()</text>

    <text x="300" y="120" class="hdr">Thread-safe equivalent: Arc&lt;Mutex&lt;T&gt;&gt;</text>
    <rect x="100" y="140" width="400" height="60" rx="8" fill="#fff3e0" stroke="#c77a3a" stroke-width="1.5"/>
    <text x="300" y="165" class="code" font-size="13">Arc::new(Mutex::new(data))</text>
    <text x="300" y="185" class="sub">multiple owners across threads, mutex enforces exclusive access</text>
  </g>

  <text x="450" y="440" text-anchor="middle" font-size="12" fill="#333" font-style="italic">
    Box = ownership. Rc/Arc = shared ownership. RefCell/Mutex = mutability despite shared access.
  </text>
</svg>
